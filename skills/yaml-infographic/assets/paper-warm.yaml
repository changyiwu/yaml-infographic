schema_version: "agent_visual_style_v1"

style:
  id: "paper_warm"
  name: "紙感立體貼紙風格"
  version: "1.2.0"
  audience_context: "教學講義與課堂投影"
  applies_to: ["image_deck", "html_deck", "infographic"]

# 對比度皆以 background 為底計算，全部通過 4.5:1（本技能 accessibility 的下限）：
# text 12.5:1、keyword 6.1:1、highlight 5.7:1。
# keyword 刻意用 amber-800 而非較亮的 amber-700——後者僅 4.38:1，未達門檻。
palette:
  background: "#F5EFE1"
  background_secondary: "#EAE2CF"
  surface: "#FFFFFF"
  text: "#1F2937"
  keyword: "#92400E"
  highlight: "#B91C1C"

emphasis:
  keyword: "Use the amber tone for keywords, active paths, and signal lines."
  priority: "Use red only for the single highest-priority statement, number, or callout."

typography:
  language: "zh-TW"
  font_feel: "沉穩、易讀、筆畫清晰的繁體中文無襯線字"
  avoid: "過細、裝飾性、手寫感、科技模板字"
  preferred_fonts: ["jf open 粉圓 2.1", "GenSenRounded TW", "Noto Sans TC"]
  # 送進生圖模型的字體描述；中文敘述給人看，這一行給模型看。
  prompt_en: "heavy rounded Traditional Chinese sans-serif with thick even strokes and open counters, rendered as dimensional lettering with a slight bevel and a soft edge highlight. Avoid hairline, decorative, handwritten, or mechanical Chinese type."

materials: ["thick die-cut vinyl sticker with rounded bevelled edges", "warm matte paper ground", "soft close contact shadow", "subtle satin highlight along top edges"]

composition:
  character: ["tactile", "dimensional", "layered", "friendly", "legible"]
  rules:
    - "Keep one dominant focal point."
    - "Use clear hierarchy and generous negative space."
    - "Render every card, icon, and badge as a thick rounded sticker lifting off the paper ground, with visible edge thickness and a soft contact shadow beneath."
    - "Create depth through rounded form, material thickness, and soft shadow — never through neon glow or heavy texture."
    - "Give icons chunky three-dimensional bodies rather than thin outlines."
    - "Fill the ground with a soft warm gradient: the lighter paper tone through the upper centre, easing into the deeper tone at the corners and along the lower edge."
    - "Scatter a few small low-contrast sticker accents across the empty ground — dots, tiny four-point sparkles, a short dashed trail, a small paper clip or a strip of tape — as quiet depth cues. Keep them sparse, tonal, set well behind the main elements, and never overlapping or touching any text."

infographic:
  default_density: "medium"
  reading_path: "top_to_bottom"
  max_sections: 6
  data_style: "數字層級清楚、圖表克制、出處明確。"

negative_prompt:
  - "No logos, watermarks, presentation mockups, or unrequested microcopy."
  - "Do not use dark or black backgrounds."
  - "No neon, bloom, or cyberpunk decoration."
  - "No flat thin-outline icons and no completely flat vector look."
  - "Background accents must stay small, sparse, and low contrast; never let them crowd the layout, touch any text, or compete with the main cards."
  - "No long, harsh, or angled cast shadows; keep shadows soft, short, and directly beneath."
  - "No glossy toy plastic or heavy reflections."
  - "No people, robots, mascots, hands, or faces unless explicitly requested."

golden_sample: "paper-warm-sample.png"

override_policy:
  default_when_unspecified: true
  explicit_user_style_wins: true
  project_brand_system_wins: true
